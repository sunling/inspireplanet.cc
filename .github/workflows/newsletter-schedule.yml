name: Weekly newsletter schedule
on:
  schedule:
    # Beijing Sunday 08:00 and 20:00; Monday through Friday 08:00.
    - cron: '0 0 * * 0-5'
    - cron: '0 12 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Read-only verification (no emails or database writes)'
        type: boolean
        default: true
        required: true
permissions:
  contents: read
concurrency:
  group: newsletter-production-schedule
  cancel-in-progress: false
jobs:
  newsletter:
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.dry_run) || vars.NEWSLETTER_AUTOMATION_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check and advance newsletter
        env:
          NEWSLETTER_AUTOMATION_SECRET: ${{ secrets.NEWSLETTER_AUTOMATION_SECRET }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/newsletter-schedule.mjs --dry-run
          else
            node scripts/newsletter-schedule.mjs
          fi
