name: Weekly newsletter schedule
on:
  schedule:
    # Beijing Sunday 08:00 and 20:00; Monday through Friday 08:00.
    - cron: '0 0 * * 0-5'
    - cron: '0 12 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Choose an execution mode'
        type: choice
        default: dry-run
        required: true
        options:
          - dry-run
          - test-reminder
          - test-newsletter
          - live
permissions:
  contents: read
concurrency:
  group: newsletter-production-schedule
  cancel-in-progress: false
jobs:
  newsletter:
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run') || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'test-reminder' || inputs.mode == 'test-newsletter') && vars.NEWSLETTER_AUTOMATION_ENABLED == 'false') || ((github.event_name == 'schedule' || inputs.mode == 'live') && vars.NEWSLETTER_AUTOMATION_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check and advance newsletter
        env:
          NEWSLETTER_AUTOMATION_SECRET: ${{ secrets.NEWSLETTER_AUTOMATION_SECRET }}
          MODE: ${{ github.event_name == 'schedule' && 'live' || inputs.mode }}
          NEWSLETTER_TEST_AT: ${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
        run: |
          case "$MODE" in
            dry-run|test-reminder|test-newsletter|live) node scripts/newsletter-schedule.mjs "--$MODE" ;;
            *) echo "Unknown mode"; exit 1 ;;
          esac
